version: '3.8'

services:
  dokploy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dokploy
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADVERTISE_ADDR=${ADVERTISE_ADDR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dokploy_data:/etc/dokploy
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1024M

  postgres:
    image: postgres:16
    container_name: dokploy-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7
    container_name: dokploy-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: dokploy-monitoring
    restart: always
    environment:
      - METRICS_CONFIG={"server":{"refreshRate":25,"port":3001,"type":"Dokploy","token":"metrics","urlCallback":"http://dokploy:3000/api/trpc/notification.receiveNotification","retentionDays":7,"cronJob":"0 0 * * *","thresholds":{"cpu":0,"memory":0}},"containers":{"refreshRate":25,"services":{"include":[],"exclude":[]}}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3001:3001"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  schedules:
    build:
      context: .
      dockerfile: Dockerfile.schedule
    container_name: dokploy-schedule
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dokploy-api
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  dokploy-network:
    driver: bridge

volumes:
  dokploy_data:
  postgres_data:
  redis_data:
